[package]
name = "rusdoo-modules"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
rusdoo-core = { path = "../rusdoo-core" }
rusdoo-orm = { path = "../rusdoo-orm" }
# an addon whose models are Python is installed by this crate, so the
# bridge belongs here rather than in whoever calls it: the models have to
# be in the registry before the tables are made, and only the install
# knows when that is
rusdoo-python = { path = "../rusdoo-python" }
quick-xml.workspace = true
csv.workspace = true
sqlx.workspace = true

[dev-dependencies]
rusdoo-testing = { path = "../rusdoo-testing" }
tokio.workspace = true
