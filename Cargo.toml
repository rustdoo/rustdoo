[workspace]
resolver = "2"
members = [
    "crates/rusdoo-core",
    "crates/rusdoo-orm",
    "crates/rusdoo-base",
    "crates/rusdoo-base-vat",
    "crates/rusdoo-resource",
    "crates/rusdoo-hr",
    "crates/rusdoo-crm",
    "crates/rusdoo-sale-crm",
    "crates/rusdoo-phone-validation",
    "crates/rusdoo-lunch",
    "crates/rusdoo-fleet",
    "crates/rusdoo-calendar",
    "crates/rusdoo-account",
    "crates/rusdoo-mail",
    "crates/rusdoo-product",
    "crates/rusdoo-purchase",
    "crates/rusdoo-purchase-requisition",
    "crates/rusdoo-sale",
    "crates/rusdoo-sale-purchase",
    "crates/rusdoo-uom",
    "crates/rusdoo-barcodes",
    "crates/rusdoo-utm",
    "crates/rusdoo-sales-team",
    "crates/rusdoo-account-debit-note",
    "crates/rusdoo-account-check-printing",
    "crates/rusdoo-data-recycle",
    "crates/rusdoo-onboarding",
    "crates/rusdoo-testing",
    "crates/rusdoo-stock",
    "crates/rusdoo-stock-account",
    "crates/rusdoo-stock-picking-batch",
    "crates/rusdoo-http",
    "crates/rusdoo-qweb",
    "crates/rusdoo-modules",
    "crates/rusdoo-analytic",
    "crates/rusdoo-rating",
    "crates/rusdoo-python",
    "crates/rusdoo-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0"
repository = "https://github.com/odoo/odoo"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["multipart"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "json", "uuid"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
quick-xml = "0.41"
csv = "1"
argon2 = "0.5"
# os padrões de regra de código de barras do Odoo são regex de verdade
regex = "1"
# campos Binary viajam em base64 pelo JSON-RPC, como no Odoo
base64 = "0.22"
