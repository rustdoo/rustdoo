[workspace]
resolver = "2"
members = [
    "crates/rodoo-core",
    "crates/rodoo-orm",
    "crates/rodoo-http",
    "crates/rodoo-qweb",
    "crates/rodoo-modules",
    "crates/rodoo-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0"
repository = "https://github.com/odoo/odoo"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "json", "uuid"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
