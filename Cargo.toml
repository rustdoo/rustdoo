[workspace]
resolver = "2"
members = [
    "crates/rusdoo-core",
    "crates/rusdoo-orm",
    "crates/rusdoo-base",
    "crates/rusdoo-http",
    "crates/rusdoo-qweb",
    "crates/rusdoo-modules",
    "crates/rusdoo-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0"
repository = "https://github.com/odoo/odoo"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "json", "uuid"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
quick-xml = "0.41"
csv = "1"
argon2 = "0.5"
